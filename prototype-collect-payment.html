
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<title>Collect Payment — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="prototype/collect-payment.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div class="stage">
  <div id="root"></div>
  <div class="caption">
    <span>Collect Payment · Delivery Partner</span>
    <button id="resetBtn" type="button">Reset demo</button>
  </div>
</div>
<script type="text/babel" src="prototype/collect-payment.jsx"></script>
<script>
  // wire the external reset button to the in-app reset by reloading state cleanly
  document.addEventListener('click', function (e) {
    if (e.target && e.target.id === 'resetBtn') {
      var back = document.querySelector('.appbar__back');
      // tap back enough to return to the collect screen, then clear inputs via reload
      location.reload();
    }
  });
</script>
</body>
</html>
